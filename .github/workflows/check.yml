name: Check
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Installer dry run
        run: bash install.sh --dry-run
      - name: Shell syntax
        run: bash -n install.sh
